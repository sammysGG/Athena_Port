version: "3.9"

services:
  control:
    build:
      context: ./services/control
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      PORT_SITE_NAME: ${PORT_SITE_NAME:-Tallinna Sadam}
      PORT_OPERATOR_USERNAME: ${PORT_OPERATOR_USERNAME}
      PORT_OPERATOR_PASSWORD: ${PORT_OPERATOR_PASSWORD}
      PORT_SESSION_SECRET: ${PORT_SESSION_SECRET}
      PORT_TICK_SECONDS: ${PORT_TICK_SECONDS:-1.0}
      PORT_BERTHS: ${PORT_BERTHS:-4}
      PORT_CRANES_PER_BERTH: ${PORT_CRANES_PER_BERTH:-2}
      PORT_CRANE_CYCLE_TICKS: ${PORT_CRANE_CYCLE_TICKS:-5}
      PORT_TRUST_PROXY: ${PORT_TRUST_PROXY:-1}
    ports:
      - "${PORT_BIND_ADDRESS:-127.0.0.1}:${PORT_PUBLISHED_PORT:-18090}:8080"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health').read()\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - port_public

networks:
  port_public:
