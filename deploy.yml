---
# Athena range — Port (Tallinna Sadam) target.
# Role tasks file: drop in as roles/<role>/tasks/main.yml (flat task list, no
# play wrapper). Runs natively under systemd — the FastAPI app is served by
# uvicorn out of a virtualenv, fronted by nginx. There is no Docker on the box.
#
# The lockdown lives in git: the port-range-update.service installed below runs
# `git reset --hard origin/main` + reinstall on every boot, so the app/scenario
# is owned by the GitHub repo and student edits on the box are wiped. The
# operator credentials + session secret live in /opt/port-range/.env and are
# generated once on first deploy.

- name: Install runtime packages (python, nginx, tooling)
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-pip
      - nginx
      - openssl
      - git
    state: present
    update_cache: yes

- name: Clone port-range repo
  ansible.builtin.git:
    repo: https://github.com/sammysGG/Athena_Port.git
    dest: /opt/port-range
    version: main
    force: yes

- name: Fix repo ownership
  ansible.builtin.file:
    path: /opt/port-range
    state: directory
    owner: root
    group: root
    recurse: yes

- name: Create the virtualenv and install dependencies
  ansible.builtin.pip:
    requirements: /opt/port-range/services/control/requirements.txt
    virtualenv: /opt/port-range/.venv
    virtualenv_command: python3 -m venv

- name: Make scripts executable
  ansible.builtin.file:
    path: /opt/port-range/scripts/generate-secrets.sh
    mode: '0755'

- name: Check if .env already exists
  ansible.builtin.stat:
    path: /opt/port-range/.env
  register: env_file

- name: Generate .env with random session secret (operator creds come from .env.example)
  ansible.builtin.shell:
    cmd: ./scripts/generate-secrets.sh
    chdir: /opt/port-range
  when: not env_file.stat.exists

- name: Enable proxy trust (nginx in front)
  ansible.builtin.lineinfile:
    path: /opt/port-range/.env
    regexp: '^PORT_TRUST_PROXY='
    line: 'PORT_TRUST_PROXY=1'

- name: Ensure .env perms are 600
  ansible.builtin.file:
    path: /opt/port-range/.env
    mode: '0600'
    owner: root
    group: root

- name: Allow HTTP/HTTPS through ufw
  ansible.builtin.command: "ufw allow {{ item }}/tcp"
  register: ufw_result
  changed_when: "'added' in ufw_result.stdout or 'updated' in ufw_result.stdout"
  failed_when: false
  loop:
    - 80
    - 443

- name: Install the port-range systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/port-range.service
    mode: '0644'
    owner: root
    group: root
    content: |
      [Unit]
      Description=Tallinna Sadam port control (FastAPI/uvicorn)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=exec
      User=www-data
      Group=www-data
      WorkingDirectory=/opt/port-range/services/control
      EnvironmentFile=/opt/port-range/.env
      ExecStart=/opt/port-range/.venv/bin/uvicorn app:app --host 127.0.0.1 --port 18090 --proxy-headers --forwarded-allow-ips "*"
      Restart=on-failure
      RestartSec=3
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

- name: Enable and (re)start the port-range service
  ansible.builtin.systemd:
    name: port-range.service
    enabled: yes
    state: restarted
    daemon_reload: yes

- name: Verify health endpoint
  ansible.builtin.uri:
    url: http://127.0.0.1:18090/health
    status_code: 200
  register: health
  retries: 10
  delay: 3
  until: health.status == 200

- name: Create TLS cert directory
  ansible.builtin.file:
    path: /etc/ssl/range
    state: directory
    mode: '0700'

- name: Generate self-signed TLS cert (shared range cert, first deploy only)
  ansible.builtin.shell:
    cmd: >
      openssl req -x509 -nodes -sha256 -days 825 -newkey rsa:2048
      -keyout /etc/ssl/range/key.pem -out /etc/ssl/range/cert.pem
      -subj "/C=UK/CN={{ hostname }}.{{ domain }}"
      -addext "subjectAltName=DNS:{{ hostname }}.{{ domain }}"
    executable: /bin/bash
    creates: /etc/ssl/range/cert.pem

- name: Configure nginx TLS reverse proxy
  ansible.builtin.copy:
    dest: /etc/nginx/sites-available/port-range.conf
    content: |
      server {
          listen 80;
          server_name {{ hostname }}.{{ domain }};
          return 301 https://$host$request_uri;
      }
      server {
          listen 443 ssl;
          server_name {{ hostname }}.{{ domain }};

          ssl_certificate     /etc/ssl/range/cert.pem;
          ssl_certificate_key /etc/ssl/range/key.pem;

          location / {
              proxy_pass http://127.0.0.1:18090;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
          }
      }

- name: Enable the port-range nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/port-range.conf
    dest: /etc/nginx/sites-enabled/port-range.conf
    state: link

- name: Disable the default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Reload nginx
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
    enabled: yes

- name: Verify HTTPS is serving through nginx
  ansible.builtin.uri:
    url: https://127.0.0.1/health
    validate_certs: no
    headers:
      Host: "{{ hostname }}.{{ domain }}"
    status_code: 200
  register: https_health
  retries: 5
  delay: 2
  until: https_health.status == 200

- name: Install boot-time update script
  ansible.builtin.copy:
    dest: /opt/port-range/scripts/update-on-boot.sh
    mode: '0755'
    owner: root
    group: root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      cd /opt/port-range
      git fetch --quiet origin main
      LOCAL=$(git rev-parse HEAD)
      REMOTE=$(git rev-parse origin/main)
      if [ "$LOCAL" != "$REMOTE" ]; then
        echo "updates found, pulling and reinstalling"
        git reset --hard origin/main
        /opt/port-range/.venv/bin/pip install -r services/control/requirements.txt
      fi
      systemctl restart port-range.service

- name: Install port-range-update systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/port-range-update.service
    mode: '0644'
    owner: root
    group: root
    content: |
      [Unit]
      Description=Pull port-range updates from git and restart the service
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      WorkingDirectory=/opt/port-range
      ExecStart=/opt/port-range/scripts/update-on-boot.sh
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

- name: Enable port-range-update on boot
  ansible.builtin.systemd:
    name: port-range-update.service
    enabled: yes
    daemon_reload: yes
